[package]
name = "bevy-bezier-splines"
version = "0.1.0"
edition = "2021"
description = "Bezier spline gizmos for Bevy, ported from Unity"
license = "EUPL-1.2"
repository = "https://github.com/sunsided/bevy-bezier-splines"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
keywords = ["bevy", "bezier", "splines", "gizmos", "curves"]
categories = ["game-development", "graphics", "rendering"]

[[example]]
name = "road_placement"
path = "examples/road_placement.rs"

[[example]]
name = "jackdaw_sync"
path = "examples/jackdaw_sync.rs"
required-features = ["jackdaw"]

[features]
default = []
# Gates the Jackdaw-facing adapter API/systems in this crate.
# This feature intentionally does not pull the `jackdaw` editor crate.
# Consumers add `jackdaw` (or `jackdaw_api` / `jackdaw_runtime`) separately as needed.
jackdaw = []

[dependencies]
bevy = "0.18"

[dev-dependencies]
bevy = "0.18"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
